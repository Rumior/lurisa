name: Daily Cron — Notifications

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Hit notification cron endpoint
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://lurisa.vercel.app/api/notifications/cron" || exit 1
