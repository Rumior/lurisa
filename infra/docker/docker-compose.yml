version: '3.8'
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    command: redis-server --appendonly yes
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lurisa
      POSTGRES_PASSWORD: lurisa_local_dev
      POSTGRES_DB: lurisa
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
volumes:
  redis-data:
  postgres-data: